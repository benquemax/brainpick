# brainpick.toml — how this wiki is compiled and served (SHARED policy, committed).
# Machine-local model endpoints live in brainpick.local.toml beside this file —
# it deep-merges over this one and stays out of git.
# Delete .brainpick/ any time; `brainpick compile` rebuilds everything.
spec = "0.1"

[modules]
graph = "on"           # T3: derive the entity graph from the pages themselves
                       # (ghosts + tags + co-occurrence; zero LLM — the only
                       # backend this contract ships; "algorithmic" also accepted).
similarity_gaps = "auto"  # the gap-detector — on for free once T2 is fresh (it is, here).

[similarity_gaps]
threshold = 0.75
max_pairs = 50
