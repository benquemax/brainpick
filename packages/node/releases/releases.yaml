# The release ledger (spec/80 *The release ledger and the what's-new notice*).
#
# Newest first. Both engines ship this file byte-identical (scripts/
# sync-releases.mjs copies it into each package; parity tests hold the copies
# to this canonical). `brainpick whats-new` reads it; the what's-new notice
# in compile output, the AGENTS.md report and brain_overview points at it.
#
# Write for the agent that will act on it, not the human who will skim it:
# `summary` is the one line worth reading; `agent_action` is imperative and
# names the exact command or file when there is one. The head entry may be
# `date: unreleased` while a release is being assembled — a released engine
# never shows ledger entries newer than itself.
#
#   kind: added | changed | fixed | removed
#   area: brain | cli | mcp | search | config | compile | webui | docs

releases:
  - version: 0.8.6
    date: 2026-09-25
    brain_format: 3
    summary: >-
      Read-only implants and the contribution flow (Python engine): mount a
      brain you cannot push to as a true mirror (writes redirect, sync
      fast-forwards only), propose fixes via brain_contribute (worktree
      proposals gated by the target's own contract) and send them upstream
      with brain_submit (forge CLI, fork remote, or patch file — never
      touches origin). brain_read gains cross-brain annotations.
    agent_action: >-
      Register read-only implants with `brainpick register --read-only`. Set
      `[serve] git = "contribute"` (or `"push"`) to expose brain_contribute
      and brain_submit. Your cortex notes that link to an implant page now
      surface as annotations when reading that page.
    changes:
      - kind: added
        area: mcp
        text: >-
          brain_contribute stages a proposed change in a git worktree on
          contrib/<name>, branched from origin's newest default, gated by the
          target brain's own henxels contract — the served checkout is never
          touched. First contact is apply-and-brief: the write lands and
          read_first returns the implant's contribution rules.
      - kind: added
        area: mcp
        text: >-
          brain_submit sends a proposal upstream without ever writing origin:
          gh/tea opens the PR from a fork, a fork remote yields a compare_url,
          else a format-patch file. Title and body are drafted from commits
          and the checks that ran.
      - kind: added
        area: mcp
        text: >-
          brain_read returns annotations — docs in other mounted brains whose
          brain:// links point at the page being read — so your cortex notes
          ride along whenever you re-read an implant page.
      - kind: added
        area: config
        text: >-
          Registry entries accept access = "read-only" | "read-write" (default
          read-write). A read-only mount makes brain_write refuse with a
          brain:// link and a two-route redirect, brain_sync a pure mirror,
          and brain_push a refusal naming brain_contribute.
      - kind: changed
        area: cli
        text: >-
          brainpick register gains --read-only and --read-write flags; the
          listing marks read-only mounts.
  - version: 0.8.5
    date: 2026-09-25
    brain_format: 3
    summary: >-
      A session started inside a brain's repo no longer fronts the repo itself
      as a second brain: `here` resolves through `[bundle] root`, so it
      coincides with the registered bundle instead of compiling every .md in
      the repo and timing out the MCP host's connect.
    agent_action: >-
      If `brainpick mcp` (no --root) was slow or timed out when Claude Code was
      opened in the brain's repo, upgrade and delete any `index.md` or
      `.brainpick/` left at the repo root beside brainpick.toml. `brain_overview`
      should count the bundle's docs only, with paths relative to the bundle.
    changes:
      - kind: fixed
        area: mcp
        text: >-
          `discover_here` took any directory holding brainpick.toml as a
          bundle root. For a repo-root config pointing at a subdirectory
          bundle, the repo was inserted as the `here` brain beside the registry
          entry for the same bundle — a federated set of two, one of them the
          whole repo. It now resolves `[bundle] root` and carries the config
          root, so `here` equals the registered bundle and is not duplicated.
  - version: 0.8.4
    date: 2026-09-25
    brain_format: 3
    summary: >-
      `brain_push` also stages the AGENTS.md report its own compile refreshed,
      so a push of a subdirectory bundle no longer leaves the repo-root report
      modified behind it.
    agent_action: >-
      If `brain_status` reports the checkout dirty right after a successful
      `brain_push` and the only modified file is AGENTS.md, upgrade — the next
      push carries it. Nothing to undo.
    changes:
      - kind: fixed
        area: mcp
        text: >-
          The push staged the bundle pathspec only. The compile it runs first
          rewrites the opt-in report block at the bundle root and at the repo
          root above it (spec/20), both outside that pathspec for a
          subdirectory bundle, so every push left the report uncommitted and
          the remote's copy stale. The report files that carry the block are
          now staged with the bundle; nothing is created.
  - version: 0.8.3
    date: 2026-09-25
    brain_format: 3
    summary: >-
      Two more places where one path meant two roots. `brainpick register REPO`
      now registers the bundle a repo-root `brainpick.toml` points at, and
      `brain_push` runs `henxels check --all` instead of handing henxels the
      bundle directory as if it were a file.
    agent_action: >-
      If a registry entry shows `bundle_path = ""` for a repo whose config has
      `[bundle] root`, remove it and register again (`brainpick register REPO
      --remove`, then `brainpick register REPO --cortex`), and delete any
      `index.md` or `.brainpick/` the old entry left at the repo root. Upgrade
      henxels to 0.19.2 as well: it now expands a directory argument, so both
      sides of brain_push agree.
    changes:
      - kind: fixed
        area: cli
        text: >-
          `register` and `register --from-hosts` resolve `[bundle] root` before
          writing the entry, and the bundle id is read from the repo's config.
          A repo-root path used to be stored as the bundle, so the registry-mode
          server compiled the whole repo as the brain and wrote its artifacts
          at the repo root.
      - kind: fixed
        area: mcp
        text: >-
          `brain_push` verifies the contract with `henxels check --all` — the
          same run the pre-commit hook does, repo-level henxels included. With
          the bundle path as the argument, henxels before 0.19.2 judged the
          directory entry as a file ("_brain — should be .md") and refused
          every push of a subdirectory bundle.
  - version: 0.8.2
    date: 2026-09-25
    brain_format: 3
    summary: >-
      `brainpick mcp --root <repo>` reads the repo's `brainpick.toml` again when
      `[bundle] root` points below it. The brain set resolved the root down to
      the bundle and then loaded the config from the bundle, found nothing there
      and used defaults — so over MCP `[serve] git` stayed off (no sync verbs in
      tools/list), `[half_life]` never faded and `[bundle] exclude` never hid.
    agent_action: >-
      Upgrade and restart any `brainpick mcp` server whose `--root` is a repo
      root above its bundle, then check tools/list for brain_status / brain_sync
      / brain_push if `[serve] git` is set. A stderr line "no brainpick.toml at
      …/<bundle> — using defaults" on server start was this bug.
    changes:
      - kind: fixed
        area: mcp
        text: >-
          `Brain` carries a `config_root` — the `--root` argument, or a registry
          entry's repo — and `BrainSet.state_for` plus the mcp writes-refusal
          load the config from there instead of from the bundle. Same family as
          the 0.8.1 `serve` double-join: one path was made to mean two roots.
          The Node engine never resolves `[bundle] root` inside its brain set,
          so it is unchanged.
  - version: 0.8.1
    date: 2026-09-24
    brain_format: 3
    summary: >-
      `brainpick serve` serves the bundle again when `[bundle] root` points
      below the repo root: the CLI applied that path twice and served a
      `<repo>/_brain/_brain` that does not exist, so the UI showed one
      generated index, no links, and T2 reported off.
    agent_action: >-
      Upgrade and restart any running `brainpick serve`. If you worked around
      this by serving from inside the bundle directory, drop the workaround —
      that route reads no repo-root `brainpick.toml`, so it silently loses
      `[bundle] exclude`, `[brain]` and the embedding backend.
    changes:
      - kind: fixed
        area: cli
        text: >-
          `serve` pre-resolved `--root` with `resolve_bundle()` and handed the
          result to `build_app()`, which joins `[bundle] root` itself — so a
          repo-root config pointing at `_brain` was served as `_brain/_brain`.
          The CLI now passes the raw `--root`, matching the Node engine, and
          prints the resolved bundle. A brain whose bundle IS the repo root
          (`root = "."`) was never affected, which is why this survived a
          release.
  - version: 0.8.0
    date: 2026-09-19
    brain_format: 3
    summary: >-
      A brain can now be operated entirely over MCP: `brain_status`,
      `brain_sync` and `brain_push` share a checkout without shelling out to
      git, `brain_contract` announces what a bundle must satisfy, and a
      federated set finally reports version/format skew and brains it cannot
      read. Sync is gated by the new `[serve] git`, default off.
    changes:
      - kind: added
        area: mcp
        text: >-
          `brain_status` / `brain_sync` / `brain_push` (spec/100). Sync resolves
          conflicts DOC-WISE through the same proposal ladder `brain_write`
          already uses — git's merge index stages 1/2/3 are exactly its
          base/ours/theirs — so conflict markers never reach a doc, where they
          would be invalid YAML that fails the contract and the compile for
          every later reader. Sync commits nothing: a clean merge is precisely
          the case where nobody read the text. Push runs the henxels contract
          itself rather than trusting the hook, which warns and exits 0 when it
          cannot find the executable; "could not run" is a refusal, not a pass.
        agent_action: >-
          Set `[serve] git = "push"` in brainpick.toml to enable them (default
          `off`; `status` and `sync` are the read-only and resolve-only rungs).
          Then prefer brain_sync/brain_push over shelling out to git, which
          lets the session stay sandboxed.
      - kind: added
        area: mcp
        text: >-
          `brain_contract` announces the requirements a bundle must satisfy as
          data — id, whether it is met, what it means, why it matters, and a fix
          for each unmet one. Folder layout, naming and memory types stay the
          project's choice; this is the small floor underneath them, so a broken
          implant can be fixed without reading brainpick's source. Always
          exposed, read-only.
        agent_action: >-
          Call `brain_contract` when a brain reports unreadable, or before
          wiring a new implant into a federated set.
      - kind: fixed
        area: mcp
        text: >-
          A federated set under-reported in two ways. Nothing compared brains,
          so an implant stamped at format 2 under a format-3 cortex looked
          identical to a current one — an agent could read format-3 conventions
          and file knowledge into an implant that does not follow them, with no
          error and no compile failure. `brain_overview` now carries `version`
          and `format` per brain plus a `skew` block whose hint leads. And a
          brain that could not be read either threw (a corrupt manifest or a
          permissions error took the whole set down, cortex included) or was
          silently invented as a phantom one-doc brain. It is now named with a
          reason in `unreadable`, reported as null rather than 0, and every
          other brain still answers.
        agent_action: >-
          If `brain_overview` reports `skew`, verify where a doc belongs before
          writing to a brain that is behind; if it reports `unreadable`, run
          `brainpick compile --root <root>` on the named brain.
  - version: 0.7.1
    date: 2026-09-18
    brain_format: 3
    summary: >-
      Every MCP tool call observes the artifacts on disk. A `brainpick mcp`
      server used to load its state once at spawn and never look again, so
      after a `git pull` + `brainpick compile` the `brain_*` tools answered
      from a pre-pull snapshot for the rest of the session — silently, because
      a stale read looks exactly like a correct one.
    changes:
      - kind: fixed
        area: mcp
        text: >-
          Tool calls adopt an out-of-process compile (spec/70 *Freshness*).
          `brainpick serve` runs a filesystem watcher; the stdio path ran
          nothing, and `brain_write` refreshed only for its own writes — so a
          `git pull`, a CLI compile, another agent or another machine all went
          unseen. Every read now compares `.brainpick/manifest.json` against
          the manifest behind the held artifacts and, when they differ, adopts
          the compile and emits the delta. An unchanged manifest costs one
          stat; adoption never compiles, because the manifest is the handoff.
          Federated sets adopt each loaded brain on the calls that touch it.
        agent_action: >-
          Upgrade every host running `brainpick mcp` (a long-lived agent-host
          server is exactly the case this fixes). Until a host is upgraded,
          restart its MCP server after pulling a brain, or read through the
          CLI — `brainpick overview` and `brainpick search` were never stale.
      - kind: fixed
        area: cli
        text: >-
          The `/api/health` e2e test in both engines asserted a hardcoded
          version string, so releasing turned the suite red rather than a
          regression doing it. Both now read the version from the package
          under test — the same source the endpoint answers from.

  - version: 0.7.0
    date: 2026-09-14
    brain_format: 3
    summary: >-
      Brain format 3: conventions are a memory type the engine recognises.
      A `type: convention` doc is a standing rule, compiled into
      `t1/conventions.json` and listed before skills in `brain_overview`
      and the AGENTS.md report; `brainpick migrate --to 3` retypes the
      template's `conventions/` pages and pins them against fading.
    changes:
      - kind: added
        area: brain
        text: >-
          Conventions (spec/85): the sixth memory type — a `type: convention`
          doc is a standing rule for how work is done, the standing result of
          a decision rather than its record. The template keeps them in
          `conventions/`, one per page, listed in `conventions/index.md`;
          the engine keys on the type alone, wherever the doc lives, and
          pins them with `[half_life.folders] conventions = 0`.
        agent_action: >-
          Run `brainpick migrate --to 3` (`--dry-run` first) in every brain
          repo: it retypes `conventions/*.md` from the template's
          `type: decision` to `type: convention`, creates
          `conventions/index.md` when absent, stamps `format = 3` and adds
          `conventions = 0` to `[half_life.folders]`. Then compile, commit
          and push. From now on, read the overview's `conventions` before
          acting, and file a new standing rule as `type: convention`.
      - kind: added
        area: compile
        text: >-
          `t1/conventions.json` (spec/20) — every convention as
          `{path, title, description}`, sorted by path, part of the
          freshness gate; the AGENTS.md report block gains a
          `Conventions (these apply to you):` section above `Skills`.
      - kind: added
        area: mcp
        text: >-
          `brain_overview` carries `conventions` before `skills`, never
          budget-trimmed, and its hint opens with how many apply and to
          read them before acting; `brainpick overview` prints the same
          list first. `brainpick init` names the read order: conventions,
          then skills, knowledge, journals.
      - kind: changed
        area: cli
        text: >-
          `brainpick migrate --to 3` — the 2 → 3 rewrite, deterministic and
          cumulative from format 1, pinned by the `migrate-kotiaivot-v2-to-3`
          conformance golden in both engines.
      - kind: changed
        area: cli
        text: >-
          Ritual block v3 — step 2 says conventions listed in the overview
          are standing rules that apply to you, read before acting. Integrate
          replaces an installed v2 block in place.
        agent_action: >-
          Re-run `brainpick integrate agents-md` (or `claude-code` /
          `opencode` / `dsh`) in every repo carrying the ritual block, and
          update any fleet instruction that embeds the block verbatim.
      - kind: fixed
        area: compile
        text: >-
          Compiling a bundle inside a repo whose AGENTS.md reports a different
          bundle (a scratch bundle under `_temp/`, say) rewrote that report
          with the wrong numbers, because compile wrote to the nearest git
          root's AGENTS.md unconditionally. The `Bundle root:` line is now the
          block's ownership claim (spec/20): only the bundle it names — or the
          fresh placeholder, which the first compile claims — refreshes it;
          any other compile warns and leaves it byte-for-byte alone.
  - version: 0.6.1
    date: 2026-09-14
    brain_format: 2
    summary: >-
      The brain ritual is v2: compile with `--root .` from the repo root.
      v1 said `--root <bundle>`, which on a repo-root brainpick.toml with
      `[bundle] root` compiled with defaults and desynced the freshness
      marker; both engines now warn on that exact misaim.
    changes:
      - kind: fixed
        area: cli
        text: >-
          Ritual block v2 — step 1 reads `brainpick compile --root .` from
          the repo root: `--root` is where `brainpick.toml` lives, never the
          bundle subdirectory it points at. The Agent Skill and every
          `--root` help string say the same. Integrate replaces an installed
          v1 block in place.
        agent_action: >-
          Re-run `brainpick integrate agents-md` (or `claude-code` /
          `opencode` / `dsh`) in every repo carrying the ritual block, and
          fix any fleet instruction that mechanises `--root` from
          `brainpick register`'s path to `--root .` at the repo root.
      - kind: added
        area: config
        text: >-
          A `--root` that finds no config while the parent's brainpick.toml
          declares that directory as its `[bundle] root` warns — naming the
          defaults in use and the `--root` meant — instead of compiling
          with defaults in silence (spec/80). Never an upward walk: a
          zero-config folder stays silent.
  - version: 0.6.0
    date: 2026-09-12
    brain_format: 2
    summary: >-
      Brain format 2 and everything that makes a brain shared memory: day
      journals, to-do lists inside the brain, skills the engine recognises,
      half-life ranking, `brainpick migrate`, the brain ritual in AGENTS.md,
      and this ledger. Do next reads as the upgrade path — walk it once, top
      to bottom, and the brain is current.
    changes:
      - kind: added
        area: brain
        text: >-
          Brain format 2 (spec/85): one journal file per day (`journals/
          YYYY-MM-DD.md`, only today at the top, earlier days under
          `journals/archive/YYYY/MM/`) and the to-do list inside the brain as
          `todo/open.md` (`type: todo`, `- [ ]` / `- [x] … (done: YYYY-MM-DD)`)
          with closed items rolled into `todo/archive/YYYY-MM-DD.md`. Format 1
          brains keep working unchanged.
        agent_action: >-
          In the brain's repo run `brainpick migrate --to 2` (`--dry-run`
          first to preview) — it splits the month journals into day files,
          rewrites the links, moves `_todo.md` into `todo/open.md`, stamps
          `format = 2` and seeds `[half_life]` — then review `git diff` and
          commit.
      - kind: added
        area: cli
        text: >-
          `brainpick migrate --to N` — the one command that rewrites committed
          bytes: deterministic, mechanical, writes by default, `--dry-run`
          prints the action list and a diff. It seeds the format's config
          defaults (`[half_life]`) when they are absent.
      - kind: added
        area: cli
        text: >-
          The brain ritual: `brainpick integrate <target>` installs a fenced
          `brainpick:begin ritual` block in AGENTS.md beside the report — pull
          and compile at session start, consult the brain before grepping or
          answering from memory, record while working, commit and push before
          finishing. The shipped Agent Skill says the same.
        agent_action: >-
          Run `brainpick integrate agents-md` (or `claude-code` / `opencode` /
          `dsh`) in every repo whose AGENTS.md carries the brain report, so the
          ritual block lands next to it; then follow it — pull first, push last.
      - kind: added
        area: brain
        text: >-
          Skills (spec/85): `type: skill` docs are procedural memory the engine
          recognises — frontmatter `depends_on` and `tools` become graph edges,
          `t1/skills.json` and a generated `skills/skilltree.md` list them, and
          brain_overview names them first. A `type: playbook` is a how-to for
          humans, not a skill. `brainpick skill list|new` scaffold them.
        agent_action: >-
          Retype every agent-facing `type: playbook` in the brain to
          `type: skill` (a playbook is for humans); write new procedures with
          `brainpick skill new <name>`; read the matching skill from
          brain_overview's `skills` before improvising one.
      - kind: added
        area: cli
        text: >-
          `brainpick integrate --export agent-skill` writes a pointer stub for
          every exported skill (`export: agent-skill` in its frontmatter) into
          the host's skills folder.
      - kind: added
        area: search
        text: >-
          Half-life ranking (spec/50): `[half_life] default` days and a
          `[half_life.folders]` table fade stale docs by `2^(-age/half_life)`,
          floored at 1/16; a doc's own `half_life` frontmatter overrides both.
          Off (0) unless configured; migrate and the brain template set a slow
          365-day default with faster journals (180) and to-dos (90), skills
          never fade.
        agent_action: >-
          When rotten notes keep outranking fresh ones, steepen that folder's
          half-life in `brainpick.toml` — never delete history to fix ranking.
      - kind: added
        area: cli
        text: >-
          `brainpick whats-new` prints this ledger for the releases since the
          brain was last compiled, with Do next as a numbered checklist;
          compile, the AGENTS.md report and brain_overview carry a one-line
          notice pointing at it.
        agent_action: >-
          When a compile or overview says "What's new", run `brainpick
          whats-new` once and walk its Do next list top to bottom.
      - kind: added
        area: search
        text: >-
          Tags are searchable and every long token carries a prefix stem, so
          `kahvin` finds `kahvi`.
      - kind: added
        area: config
        text: >-
          `[update] check` — the engine looks up its latest published version
          at most once a day and says so in compile output, the AGENTS.md report
          and brain_overview; `BRAINPICK_UPDATE_CHECK=false` silences it.
      - kind: changed
        area: config
        text: >-
          Embedding detection is multilingual first: `bge-m3` leads, and
          English-only models are named as such by `brainpick init`.
      - kind: changed
        area: webui
        text: depends_on edges are drawn in a style of their own.

  - version: 0.5.0
    date: 2026-09-11
    brain_format: 1
    summary: >-
      Federation gains roles — one cortex plus any number of implants.
    changes:
      - kind: added
        area: mcp
        text: >-
          `brainpick register --cortex` / `--implant` name the two roles of a
          brain set (spec/75); scope `me` is the cortex. `--user` survives as
          a hidden alias and `role = "user"` registries are still read.
        agent_action: >-
          Register your own memory with `--cortex` and each repository's
          bundle with `--implant`; one user-scope `brainpick mcp` serves all.
      - kind: changed
        area: mcp
        text: >-
          An unqualified `brain_write` falls back to the cortex when there is
          no *here* instead of declining; it still never guesses between
          implants.

