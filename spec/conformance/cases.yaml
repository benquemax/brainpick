# Language-agnostic conformance cases. Each engine's harness reads this file
# and runs every case against the shared fixtures. Adding a case here
# tightens both engines at once — behavior changes land HERE first.

version: "0.1"

cases:
  # class: compile — copy the fixture bundle to a temp dir, run a full
  # compile with default config, byte-compare each listed artifact against
  # fixtures/expected/<bundle>/ (manifest compared after normalizing the
  # volatile fields named in spec/10-manifest.md).
  - id: compile-kotiaurinko-t1
    class: compile
    bundle: kotiaurinko
    artifacts:
      - .brainpick/manifest.json
      - .brainpick/t1/graph.json
      - .brainpick/t1/docs.jsonl
      - index.md            # the generated section, in the bundle itself

  # class: compile-idempotent — compile the fixture twice; the second run
  # must be a no-op: identical artifacts, unchanged seq.
  - id: compile-kotiaurinko-idempotent
    class: compile-idempotent
    bundle: kotiaurinko

  # kotiaivot (spec/85): a brain — [brain] format = 2, skills/ with a
  # `type: skill` doc that depends_on another and drives a tool, a
  # `type: playbook` how-to for humans that must NOT be a skill, todo/
  # with `type: todo` lists (open.md: two open, one done with a `(done:)`
  # date; archive/2026-07-01.md: one done, dated by its timestamp), raw/
  # excluded. Proves the depends_on edge, skills.json and todos.json
  # (spec/20), the generated skilltree.md, and that raw/ never reaches the
  # manifest.
  - id: compile-kotiaivot-t1
    class: compile
    bundle: kotiaivot
    artifacts:
      - .brainpick/manifest.json
      - .brainpick/t1/graph.json
      - .brainpick/t1/docs.jsonl
      - .brainpick/t1/skills.json
      - .brainpick/t1/todos.json
      - index.md
      - skills/skilltree.md

  - id: compile-kotiaivot-idempotent
    class: compile-idempotent
    bundle: kotiaivot

  # class: check-fresh — after a compile, --check-fresh exits 0; after
  # mutating the named file, it exits 1.
  - id: check-fresh-kotiaurinko
    class: check-fresh
    bundle: kotiaurinko
    mutate: kuu.md

  # class: chunks — build the normative T2 chunk set (spec/30 chunker) from
  # the bundle and byte-compare its canonical JSONL against the golden.
  - id: chunks-kotiaurinko
    class: chunks
    bundle: kotiaurinko
    artifact: t2/chunks.jsonl

  # class: query — run searches against the compiled fixture and assert the
  # top-k result SET (order-insensitive, scores ignored) — or the ORDER
  # when `expect_order: true`. Cases with
  # `embedder: mock` compile T2 with the normative mock embedder (spec/30)
  # first: chunker → vectors → store → retrieval → router, end to end.
  - id: search-keyword-skill-boost
    class: query
    bundle: kotiaivot
    query: "morning coffee"
    mode: keyword
    limit: 8
    # Reviewed: knowledge/kahvi.md says "morning" and "coffee" in its
    # description AND body, so raw BM25 ranks it first (0.99 vs 0.87). The skill
    # kahvin-keitto.md matches on its trigger description — and the skill boost
    # (spec/50, ×1.2) lifts it above the prose page: the read path starts with
    # skills. veden-keitto.md matches "coffee" only via its own description.
    # An engine without the boost returns kahvi.md first and fails. The to-do
    # list todo/open.md (format 2) says "morning coffee" in its description
    # and trails the skill; it is prose too, and unboosted.
    expect_paths: [skills/kahvin-keitto.md, knowledge/kahvi.md, todo/open.md, skills/veden-keitto.md]
    expect_order: true

  # Tags are searchable (spec/50): `vesi` appears in veden-keitto.md ONLY as
  # a tag — nowhere in its title, description or body. An engine that drops
  # tags from the searchable text returns nothing and fails.
  - id: search-keyword-tag-only
    class: query
    bundle: kotiaivot
    query: "vesi"
    mode: keyword
    limit: 8
    expect_paths: [skills/veden-keitto.md]

  # To-do lists are searchable (spec/85 *To-do lists*): `descale` occurs
  # only in an open item of todo/open.md. An engine that leaves the to-do
  # list out of the index — format 1's `_todo.md` beside the brain — returns
  # nothing and fails.
  - id: search-keyword-todo-item
    class: query
    bundle: kotiaivot
    query: "descale"
    mode: keyword
    limit: 8
    expect_paths: [todo/open.md]

  # Half-life (spec/50): with `skills` fading at one day and `now` a month
  # after the fixture's timestamps, the boosted skill that led
  # search-keyword-skill-boost sinks to the floor (1/16) below every
  # never-fading page — still present (nothing is filtered), just harder to
  # recall. `half_life` is the [half_life] config table; `now` fixes the
  # clock. An engine that ignores the factor keeps the skill first and fails.
  - id: search-keyword-half-life
    class: query
    bundle: kotiaivot
    query: "kahvi"
    mode: keyword
    limit: 8
    half_life: {default: 0, folders: {skills: 1}}
    now: "2026-08-01T00:00:00Z"
    expect_paths: [knowledge/kahvi.md, knowledge/vieraat.md, todo/archive/2026-07-01.md,
                   skills/kahvin-keitto.md, skills/veden-keitto.md]
    expect_order: true

  # Stem terms (spec/50): `kahvia` (partitive) occurs nowhere; its 4-char
  # prefix `kahv` is shared with `kahvi`/`kahvin`, so every page that says
  # or tags coffee is reached — the archived to-do that names the skill
  # included. An exact-token-only engine returns nothing.
  - id: search-keyword-stem
    class: query
    bundle: kotiaivot
    query: "kahvia"
    mode: keyword
    limit: 8
    expect_paths: [knowledge/kahvi.md, knowledge/vieraat.md, skills/kahvin-keitto.md,
                   skills/veden-keitto.md, todo/archive/2026-07-01.md]

  - id: search-keyword-aurinko
    class: query
    bundle: kotiaurinko
    query: "aurinko"
    mode: keyword
    limit: 8
    expect_paths: [aurinko.md, komeetta.md, planeetat.md, yksinainen.md]

  - id: search-semantic-kuu-vuorovesi
    class: query
    bundle: kotiaurinko
    query: "kuu vuorovesi maa"
    mode: semantic
    embedder: mock
    limit: 4
    # Reviewed: kuu/planeetat/maa are the moon–tides–earth neighborhood (their
    # bodies cross-link kuu and maa); yksinainen is the mock's 16-bucket hash
    # tail — and what separates chunk-vector recall from BM25 (which ranks
    # aurinko.md fourth instead).
    expect_paths: [kuu.md, planeetat.md, maa.md, yksinainen.md]

  - id: search-semantic-title-komeetta
    class: query
    bundle: kotiaurinko
    query: "komeetta"
    mode: semantic
    embedder: mock
    limit: 4
    # Reviewed: "komeetta" IS the title of komeetta.md, yet the mock vector
    # neighbourhood (maa/aurinko/yksinainen/kuu) MISSES it — a real short-title miss.
    # The title-match guarantee injects the named page so typing an article's name
    # always returns it, in semantic too; kuu.md (the vector tail's 4th) drops at the
    # limit. A pure-vector engine returns the neighbourhood without komeetta and fails.
    expect_paths: [komeetta.md, maa.md, aurinko.md, yksinainen.md]

  - id: search-auto-aurinko-fused
    class: query
    bundle: kotiaurinko
    query: "aurinko"
    mode: auto
    embedder: mock
    limit: 8
    # Reviewed: keyword alone finds only the 4 docs whose text says "aurinko";
    # RRF fusion widens recall to every doc of this sun-centered bundle, so the
    # fused set proves semantic ranking actually joined (a keyword-only engine
    # returns 4 paths and fails).
    expect_paths: [aurinko.md, komeetta.md, kuu.md, maa.md, planeetat.md,
                   saaret/atolli.md, saaret/laguuni.md, yksinainen.md]

  # class: federated-query (spec/75) — compile each listed fixture bundle as its
  # own brain (alias → bundle), run brain_search over the SET under `scope`, and
  # assert the top-k set of QUALIFIED paths (alias:path; order-insensitive,
  # scores ignored). Federation touches no artifact — this class proves the
  # fan-out, the merge and the qualification, not compilation.
  - id: federated-keyword-kuu-all
    class: federated-query
    brains: {aurinko: kotiaurinko, kirja: kotikirja}
    query: "kuu"
    mode: keyword
    scope: all
    limit: 8
    # Reviewed: "kuu" names the moon in BOTH brains — kotiaurinko's kuu/maa/aurinko
    # say it in body or title, kotikirja's notebook says it in title and body. A
    # single-brain engine returns one side only and fails; an engine that forgets
    # to qualify returns bare paths and fails.
    expect_paths: [aurinko:kuu.md, aurinko:maa.md, aurinko:aurinko.md,
                   kirja:kuu-muistio.md, kirja:kahvi.md]

  - id: federated-keyword-kuu-scoped
    class: federated-query
    brains: {aurinko: kotiaurinko, kirja: kotikirja}
    query: "kuu"
    mode: keyword
    scope: kirja
    limit: 8
    # Reviewed: scope narrows the fan-out to the named alias — the same query over
    # kotikirja alone; kotiaurinko's moon pages must NOT appear.
    expect_paths: [kirja:kuu-muistio.md, kirja:kahvi.md]

  - id: federated-auto-kuu-rank-merge
    class: federated-query
    brains: {aurinko: kotiaurinko, kirja: kotikirja}
    embed: [aurinko]          # these brains get the spec/30 mock embedder → T2 fresh → RRF scores
    query: "kuu"
    mode: auto
    scope: all
    limit: 8
    # Reviewed: aurinko fuses keyword+semantic (RRF fractions ~0.03; its own
    # ranking puts maa.md first under the mock embedder), kirja is T1-only (raw
    # BM25 ~0.3). Scores are not comparable across brains, so the merge is by
    # RANK — the brains' first hits, then their second hits, … then aurinko's
    # remaining semantic hits. An engine that merges by score puts every kirja
    # hit above every aurinko hit and fails; the ORDER is asserted here.
    expect_paths: [aurinko:maa.md, kirja:kuu-muistio.md, aurinko:kuu.md, kirja:kahvi.md,
                   aurinko:aurinko.md, aurinko:yksinainen.md, aurinko:komeetta.md, aurinko:planeetat.md]
    expect_order: true

  # class: delta — apply scripted mutations to a compiled fixture, recompile
  # after each step, and compare emitted graph.delta payloads against the
  # scenario's expected-deltas.jsonl (seq-relative).
  - id: live-edit-01
    class: delta
    bundle: kotiaurinko
    scenario: live-edit-01

  # class: report — render the opt-in AGENTS.md brain report block (spec/20) from
  # the compiled fixture (bundle_root ".") and byte-compare it against the golden.
  # The block is what `brainpick integrate agents-md` installs and every compile
  # refreshes; the golden holds exactly the rendered block plus a trailing LF.
  - id: report-kotiaurinko
    class: report
    bundle: kotiaurinko
    artifact: agents-report.md

  # kotiaivot's report carries the Skills section (spec/20) — present only
  # when the bundle holds a skill, so kotiaurinko's golden proves the omission.
  - id: report-kotiaivot
    class: report
    bundle: kotiaivot
    artifact: agents-report.md

  # class: kg-algorithmic — the T3 algorithmic BACKEND (spec/40). Compile the
  # bundle with the default config (graph = "algorithmic") and byte-compare the
  # produced export against goldens: the derivation is exact and normative, so
  # both engines produce identical bytes NATIVELY (no delegation, zero skips).
  # kotiaurinko carries one ghost (olematon) and eight tags — a non-empty graph.
  - id: kg-algorithmic-kotiaurinko
    class: kg-algorithmic
    bundle: kotiaurinko
    artifacts:
      - .brainpick/t3/entities.jsonl
      - .brainpick/t3/relations.jsonl
      - .brainpick/t3/kg-meta.json

  # class: kg-query — the T3 CONSUMER (spec/40). The harness compiles the bundle,
  # stages the hand-authored export from fixtures/expected/<bundle>/t3/ into the
  # compiled .brainpick/t3/ (the extractor is never invoked in conformance), then
  # asserts the document SET returned by the normative reader. op=neighbors walks
  # brain_neighbors layer=entities from `doc` to `depth` and takes the union of the
  # source_docs grounding the reached entities; op=search runs mode=graph and takes
  # the ranked hit paths at `limit`.
  - id: kg-neighbors-kuu-entities
    class: kg-query
    bundle: kotiaurinko
    op: neighbors
    doc: kuu.md
    depth: 1
    # Reviewed: kuu.md is grounded by kuu/maa/vuorovesi (distance 0); one relation
    # hop reaches planeetat (maa belongs to the worlds). The union of those four
    # entities' source_docs is the entity-layer neighborhood — a set no T1 link
    # walk produces, so a links-degraded engine (entity nodes absent) fails here.
    expect_paths: [aurinko.md, kuu.md, maa.md, planeetat.md]

  - id: kg-graph-orbits-star
    class: kg-query
    bundle: kotiaurinko
    op: search
    query: "what orbits the star"
    limit: 4
    # Reviewed: the entity graph ranks the star (aurinko) and everything that orbits
    # it — komeetta and the worlds (planeetat), and maa which belongs to the worlds.
    # kuu (the moon orbits the earth, NOT the star) ranks last and is excluded at 4.
    # A keyword engine returns the islands here instead (komeetta.md is its LAST hit),
    # so matching this set proves the graph retriever actually ran.
    expect_paths: [aurinko.md, komeetta.md, maa.md, planeetat.md]

  - id: kg-graph-vuorovesi-expands
    class: kg-query
    bundle: kotiaurinko
    op: search
    query: "vuorovesi"
    limit: 8
    # Reviewed: no document body contains "vuorovesi" (keyword returns EMPTY), yet
    # the entity grounds kuu.md and one hop over the tide→moon relation reaches the
    # moon's docs. The set proves both the export read and the one-hop expansion.
    expect_paths: [aurinko.md, kuu.md, maa.md]

  # class: similarity-gaps (spec/45) — compile the bundle with the mock embedder
  # (T2 on) and default [similarity_gaps] config (threshold 0.75, max_pairs 50),
  # byte-compare the produced similarity-gaps.json against the golden. The mock
  # embedder is deterministic, so exact pairs AND scores are golden, like
  # kg-algorithmic.
  - id: similarity-gaps-kotiaurinko
    class: similarity-gaps
    bundle: kotiaurinko
    artifact: .brainpick/t1/similarity-gaps.json
    # Reviewed: under the mock embedder's doc-mean-pooled vectors, three pairs
    # clear the default 0.75 threshold, all unlinked in T1: aurinko.md/maa.md
    # (0.885 — the highest similarity in the bundle, despite no direct edge;
    # they connect only via kuu.md and planeetat.md as intermediaries) and
    # komeetta.md/planeetat.md (0.812) both share heavy "Aurinko" vocabulary.
    # komeetta.md/saaret/laguuni.md (0.798) is the mock's 16-bucket hash tail —
    # a genuinely unrelated pair the deterministic mock still scores above
    # threshold, same honest caveat as search-semantic-kuu-vuorovesi's tail.

  # class: migrate — `brainpick migrate --to N` (spec/85 *Versioning and
  # migration*), the one command that rewrites committed bytes. Copy the
  # format-1 fixture to a temp dir (renaming its shipped `gitignore` to
  # `.gitignore`), run the migration with BRAINPICK_TODAY fixed, and compare
  # the whole resulting tree — every file's bytes AND the set of paths — to
  # the golden tree under fixtures/expected/<bundle>/migrated/ (which ships
  # its `.gitignore` un-dotted the same way). A `--dry-run`
  # first must leave the copy byte-identical to the fixture. Both engines
  # natively; deterministic by construction.
  - id: migrate-kotiaivot-v1-to-2
    class: migrate
    bundle: kotiaivot-v1
    to: 2
    today: "2026-07-02"
    expected_tree: migrated

  # class: whats-new — the what's-new notice (spec/80 *The release ledger*):
  # a pure function of the fixture ledger, the running engine's version
  # (`current`), the version that last compiled the brain (`since`, null when
  # there was no manifest) and the brain's stamped format (`format`, null when
  # not a brain). `expected` is the exact notice object, or null. Both engines.
  # The fixture ledger's head (1.2.0, `unreleased`, brain format 3) plays the
  # dev checkout: it is never a release one could have missed, but the format
  # it declares is the one the engine at hand writes.
  - id: whats-new-releases-since-last-compile
    class: whats-new
    ledger: ledger.yaml
    current: "1.1.1"
    since: "1.0.0"
    format: 3
    expected:
      since: "1.0.0"
      current: "1.1.1"
      releases: ["1.1.1", "1.1.0"]
      hint: "brainpick 1.0.0 → 1.1.1: 2 releases since this brain was last compiled — run `brainpick whats-new --since 1.0.0`"
  - id: whats-new-format-behind-the-unreleased-head
    class: whats-new
    ledger: ledger.yaml
    current: "1.1.1"
    since: "1.1.1"
    format: 2
    expected:
      since: "1.1.1"
      current: "1.1.1"
      format: {current: 2, latest: 3}
      hint: "brain format 2 → 3: run `brainpick migrate --to 3`"
  - id: whats-new-both-parts
    class: whats-new
    ledger: ledger.yaml
    current: "1.1.0"
    since: "1.0.0"
    format: 1
    expected:
      since: "1.0.0"
      current: "1.1.0"
      releases: ["1.1.0"]
      format: {current: 1, latest: 3}
      hint: "brainpick 1.0.0 → 1.1.0: 1 release since this brain was last compiled — run `brainpick whats-new --since 1.0.0`; brain format 1 → 3: run `brainpick migrate --to 3`"
  - id: whats-new-nothing-to-say
    class: whats-new
    ledger: ledger.yaml
    current: "1.1.1"
    since: "1.1.1"
    format: 3
    expected: null
  - id: whats-new-first-compile-not-a-brain
    class: whats-new
    ledger: ledger.yaml
    current: "1.1.1"
    since: null
    format: null
    expected: null
  - id: whats-new-first-compile-of-an-old-brain
    class: whats-new
    ledger: ledger.yaml
    current: "1.1.1"
    since: null
    format: 1
    expected:
      current: "1.1.1"
      format: {current: 1, latest: 3}
      hint: "brain format 1 → 3: run `brainpick migrate --to 3`"
  - id: whats-new-unreleased-head-is-not-a-missed-release
    class: whats-new
    ledger: ledger.yaml
    current: "1.2.0"
    since: "1.1.1"
    format: 3
    expected: null
  - id: whats-new-a-format-zero-wiki-hears-nothing
    class: whats-new
    ledger: ledger.yaml
    current: "1.1.1"
    since: "1.1.1"
    format: 0
    expected: null

  # class: whats-new-text — what `brainpick whats-new` PRINTS (spec/80): the
  # shown releases newest first, then "Do next:" as a numbered checklist in
  # the order the actions should be done — oldest shown release first, each
  # release's actions in ledger order, the format part last. Byte-compared
  # against the golden text under fixtures/expected/releases/. Both engines.
  - id: whats-new-text-two-releases-and-a-format
    class: whats-new-text
    ledger: ledger.yaml
    current: "1.1.1"
    since: "1.0.0"
    format: 1
    expected_text: whats-new-two-releases-and-a-format.md
  - id: whats-new-text-current-alone
    class: whats-new-text
    ledger: ledger.yaml
    current: "1.1.1"
    since: null
    format: 2
    expected_text: whats-new-current-alone.md

  # class: ritual — the brain ritual block `brainpick integrate` installs in
  # AGENTS.md (spec/20 *The brain ritual block*): the block both engines
  # render (begin marker with the text's version, the canonical body, end
  # marker, trailing LF) byte-compared against the golden; installing it into
  # a marked AGENTS.md places it directly below the report block.
  - id: ritual-block
    class: ritual
    artifact: ritual-block.md
