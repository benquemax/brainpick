name: release

# Publish v0.1+ to PyPI. Triggered by pushing a version tag (v0.1.0) or run
# manually. The npm publish is parked (docs/reference/adr/pypi-first-release.md)
# — restoring it is a git revert plus an NPM_TOKEN secret. Version lockstep is
# still enforced (the Node engine stays a native peer in the repo), so a
# half-bumped release cannot ship.
#
# The static demo brain deploys from its own workflow (pages.yml) — it fires
# on the same v* tags, plus manually, without risking a package publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version to verify, e.g. v0.1.0 (must equal the package version)"
        required: true

jobs:
  build-webui:
    name: build the shared web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: version lockstep
        run: node scripts/check-versions.mjs "${{ github.event.inputs.version || github.ref_name }}"
      - run: npm run build -w packages/webui
      - uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: packages/webui/dist

  publish-pypi:
    name: publish to PyPI (trusted publishing)
    needs: build-webui
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # OIDC trusted publishing — no API token in secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: packages/webui/dist
      - name: sync the UI + skill into the package
        run: |
          node scripts/sync-ui.mjs
          node scripts/sync-skill.mjs
      - uses: astral-sh/setup-uv@v5
      - name: build wheel + sdist
        working-directory: packages/python
        run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist
